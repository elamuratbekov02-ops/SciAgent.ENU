services:
  - type: web
    name: sciagent-enu
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: SCIAGENT_DEMO_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
